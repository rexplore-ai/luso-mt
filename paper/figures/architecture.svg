  <rect class="norm" x="150.0" y="710" width="260" height="32" rx="6"/>
  <text class="t" x="280" y="731.0">RMSNorm</text>
  <rect class="ffn" x="150.0" y="628" width="260" height="54" rx="6"/>
  <text class="t" x="280" y="653.0">Gated-GELU feed-forward</text>
  <text class="s" x="280" y="670.0">GELU(xW₀) ⊙ (xW₁) · W₂</text>
  <circle class="add" cx="280" cy="602" r="12"/>
  <path class="plus" d="M273,602 H287 M280,595 V609"/>
  <path class="line" d="M280,1012 V947" marker-end="url(#a)"/>
  <path class="line" d="M280,912 V893" marker-end="url(#a)"/>
  <path class="line" d="M280,836 V823" marker-end="url(#a)"/>
  <path class="line" d="M280,796 V745" marker-end="url(#a)"/>
  <path class="line" d="M280,710 V685" marker-end="url(#a)"/>
  <path class="line" d="M280,628 V617" marker-end="url(#a)"/>
  <path class="line" d="M280,590 V527" marker-end="url(#a)"/>
  <rect class="norm" x="190.0" y="492" width="180" height="32" rx="6"/>
  <text class="t" x="280" y="513.0">Final RMSNorm</text>
  <text class="sub" x="294" y="480">encoder states h₁…hₙ</text>
  <rect class="tok" x="125.0" y="1078" width="310" height="44" rx="6"/>
  <text class="t" x="280" y="1098.0">SentencePiece unigram</text>
  <text class="s" x="280" y="1115.0">one vocabulary for en · ny · tum (16k tiny, 32k small)</text>
  <path class="line" d="M280,1078 V1055" marker-end="url(#a)"/>
  <rect class="io" x="100" y="1152" width="360" height="40" rx="8"/>
  <text class="m" x="280" y="1177">&lt;2ny&gt; Where is the nearest clinic?</text>
  <path class="line" d="M280,1152 V1125" marker-end="url(#a)"/>
  <text class="sub" x="280" y="1216" text-anchor="middle">source sentence with target-language tag</text>
  <text class="lab" x="552" y="342">Decoder</text>
  <rect class="stack2" x="552" y="362" width="362" height="636" rx="14"/>
  <rect class="stack" x="546" y="356" width="362" height="636" rx="14"/>
  <text class="rep" x="962" y="672" text-anchor="middle">N×</text>
  <text class="sub" x="962" y="696" text-anchor="middle">tiny 2</text>
  <text class="sub" x="962" y="712" text-anchor="middle">small 4</text>
  <text class="sub" x="962" y="732" text-anchor="middle">(shallow)</text>
  <rect class="emb" x="590.0" y="1012" width="260" height="40" rx="6"/>
  <text class="t" x="720" y="1037.0">Token embedding E</text>
  <circle class="dot" cx="720" cy="972" r="3.4"/>
  <path class="res" d="M724,972 H884 V808 H735" marker-end="url(#ar)"/>
  <rect class="norm" x="590.0" y="912" width="260" height="32" rx="6"/>
  <text class="t" x="720" y="933.0">RMSNorm</text>
  <rect class="attn" x="590.0" y="836" width="260" height="54" rx="6"/>
  <text class="t" x="720" y="861.0">Causal self-attention</text>
  <text class="s" x="720" y="878.0">sees only earlier output tokens</text>
  <circle class="add" cx="720" cy="808" r="12"/>
  <path class="plus" d="M713,808 H727 M720,801 V815"/>
  <circle class="dot" cx="720" cy="772" r="3.4"/>
  <path class="res" d="M724,772 H884 V602 H735" marker-end="url(#ar)"/>
  <rect class="norm" x="590.0" y="710" width="260" height="32" rx="6"/>
  <text class="t" x="720" y="731.0">RMSNorm</text>
  <rect class="xattn" x="590.0" y="628" width="260" height="54" rx="6"/>
  <text class="t" x="720" y="653.0">Cross-attention</text>
  <text class="s" x="720" y="670.0">queries: decoder · keys, values: encoder</text>
  <circle class="add" cx="720" cy="602" r="12"/>
  <path class="plus" d="M713,602 H727 M720,595 V609"/>
  <circle class="dot" cx="720" cy="566" r="3.4"/>
  <path class="res" d="M724,566 H884 V396 H735" marker-end="url(#ar)"/>
  <rect class="norm" x="590.0" y="504" width="260" height="32" rx="6"/>
  <text class="t" x="720" y="525.0">RMSNorm</text>
  <rect class="ffn" x="590.0" y="422" width="260" height="54" rx="6"/>
  <text class="t" x="720" y="447.0">Gated-GELU feed-forward</text>
  <text class="s" x="720" y="464.0">same form as the encoder</text>
  <circle class="add" cx="720" cy="396" r="12"/>
  <path class="plus" d="M713,396 H727 M720,389 V403"/>
  <path class="line" d="M720,1012 V947" marker-end="url(#a)"/>
  <path class="line" d="M720,912 V893" marker-end="url(#a)"/>
  <path class="line" d="M720,836 V823" marker-end="url(#a)"/>
  <path class="line" d="M720,796 V745" marker-end="url(#a)"/>
  <path class="line" d="M720,710 V685" marker-end="url(#a)"/>
  <path class="line" d="M720,628 V617" marker-end="url(#a)"/>
  <path class="line" d="M720,590 V539" marker-end="url(#a)"/>
  <path class="line" d="M720,504 V479" marker-end="url(#a)"/>
  <path class="line" d="M720,422 V411" marker-end="url(#a)"/>
  <path class="line" d="M720,384 V323" marker-end="url(#a)"/>
  <rect class="norm" x="630.0" y="288" width="180" height="32" rx="6"/>
  <text class="t" x="720" y="309.0">Final RMSNorm</text>
  <path class="line" d="M720,288 V259" marker-end="url(#a)"/>
  <rect class="emb" x="600.0" y="216" width="240" height="40" rx="6"/>
  <text class="t" x="720" y="241.0">Linear · Eᵀ (tied)</text>
  <path class="line" d="M720,216 V187" marker-end="url(#a)"/>
  <rect class="out" x="625.0" y="152" width="190" height="32" rx="6"/>
  <text class="t" x="720" y="173.0">Softmax · beam search</text>
  <path class="line" d="M720,152 V123" marker-end="url(#a)"/>
  <rect class="io" x="545" y="80" width="350" height="40" rx="8"/>
  <text class="m" x="720" y="105">Chipatala chapafupi chili kuti?</text>
  <text class="sub" x="720" y="64" text-anchor="middle">output, one token at a time</text>
  <rect class="tok" x="565.0" y="1078" width="310" height="44" rx="6"/>
  <text class="t" x="720" y="1098.0">Same vocabulary</text>
  <text class="s" x="720" y="1115.0">tokens generated so far (shifted right)</text>
  <path class="line" d="M720,1078 V1055" marker-end="url(#a)"/>
  <rect class="io" x="545" y="1152" width="350" height="40" rx="8"/>
  <text class="m" x="720" y="1177">&lt;s&gt; Chipatala chapafupi …</text>
  <path class="line" d="M720,1152 V1125" marker-end="url(#a)"/>
  <path class="kv" d="M280,492 V446 H508 V655 H587" marker-end="url(#ak)"/>
  <text class="kvt" x="516" y="552">K, V</text>
  <path class="tie" d="M410,1032 H590"/>
  <text class="tiet" x="500" y="1024" text-anchor="middle">one matrix E</text>
  <path class="tie" d="M840,236 H1010 V1032 H850"/>
  <text class="tiet" x="925" y="228" text-anchor="middle">reuses E</text>
